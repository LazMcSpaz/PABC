<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable=no: this is a game UI, not a document —
         the board has its own pinch-to-zoom (BoardViewport.jsx) and several
         controls rely on a clean tap/double-tap (the tech wheel's tap-to-
         preview-then-tap-to-confirm). Without this, iOS Safari's native
         double-tap-to-zoom and page-level pinch would fight both. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>Ashland Conquest</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
